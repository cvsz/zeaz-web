name: Deploy www.zeaz.dev

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: zeaz-web-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run deploy:dry

  deploy:
    needs: validate
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: https://www.zeaz.dev/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Upload standalone Cloudflare Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Atomically cut over production route
        run: node scripts/cutover-route.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify standalone production health
        run: |
          body="$(curl --fail --silent --show-error --header 'Cache-Control: no-cache' 'https://www.zeaz.dev/health?verify=1')"
          printf '%s\n' "$body"
          printf '%s' "$body" | grep -q '"runtime": "standalone"'
