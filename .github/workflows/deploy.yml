name: Deploy www.zeaz.dev

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Confirm authorization to publish the Worker and cut over www.zeaz.dev"
        required: true
        type: boolean
        default: false
      expected_sha:
        description: "Exact 40-character main commit SHA validated for this deployment"
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'

permissions:
  contents: read

concurrency:
  group: zeaz-web-production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run deploy:dry

  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirm_production_deploy == true }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: production
      url: https://www.zeaz.dev/
    steps:
      - name: Verify exact main commit SHA before accessing deployment credentials
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Production deployment must be dispatched from main"; exit 1; }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Expected SHA must be a full lowercase 40-character commit"; exit 1; }
          [[ "$EXPECTED_SHA" == "$GITHUB_SHA" ]] || { echo "::error::Expected SHA does not match the dispatched commit"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          whoami_log="${RUNNER_TEMP}/wrangler-whoami.log"
          if ! ./node_modules/.bin/wrangler whoami >"$whoami_log" 2>&1; then
            rm -f "$whoami_log"
            echo "::error::Cloudflare credential preflight failed; no Worker upload or route cutover was attempted. Verify token validity and scope in the approved secret manager."
            exit 1
          fi
          rm -f "$whoami_log"
          echo "Cloudflare credential preflight succeeded."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Upload standalone Cloudflare Worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Atomically cut over and verify production route
        run: node scripts/cutover-route.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deployment summary
        run: |
          echo 'Cloudflare Worker upload completed.'
          echo 'Cloudflare Routes API verified www.zeaz.dev/* -> zeaz-web.'
          echo 'Public runtime probes are advisory when Cloudflare security challenge is active.'
