name: Regenerate deterministic npm lockfile

on:
  push:
    branches:
      - hardening/deterministic-npm-lock-20260915

permissions:
  contents: write

concurrency:
  group: regenerate-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regenerate-lockfile:
    if: ${{ !contains(github.event.head_commit.message, '[lock-generated]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Generate lockfile without package lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify lockfile is present and package manifest is unchanged
        shell: bash
        run: |
          set -euo pipefail
          test -s package-lock.json
          git diff --exit-code -- package.json
      - name: Commit generated lockfile to hardening branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already deterministic for package.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: add deterministic npm lockfile [lock-generated]"
          git push origin HEAD:${GITHUB_REF_NAME}
