name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Static and runtime validation
        run: npm test
      - name: Cloudflare bundle dry-run
        run: npm run deploy:dry
      - name: Build hardened container
        run: docker build --pull --tag zeaz-web:ci .
      - name: Verify container runs as non-root
        run: |
          test "$(docker image inspect zeaz-web:ci --format '{{.Config.User}}')" = "node"
          test "$(docker image inspect zeaz-web:ci --format '{{json .Config.Healthcheck.Test}}')" != "null"
      - name: Validate repository YAML
        run: ruby -e 'require "yaml"; Dir.glob(".github/**/*.{yml,yaml}").each { |f| YAML.load_file(f); puts f }'
